<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071318">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Uber Engine - Daily & Weekly Plan</title>
    <link rel="stylesheet" href="css/styles.css?v=3.1.0">
    <link rel="stylesheet" href="css/v2-blocks.css?v=3.1.0">
  </head>
  <body>
    <main class="engine-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">UBER ENGINE</p>
          <h1>Daily &amp; Weekly Plan</h1>
        </div>
        <div id="sync-status" class="sync-status" aria-live="polite">SYNCING</div>
      </header>

      <!-- Weekly Target Card -->
      <section class="target-card" aria-labelledby="weekly-target-title">
        <p id="weekly-target-title" class="eyebrow">WEEKLY TARGET</p>
        <output id="weekly-target" class="target-value" title="Tap to enter custom weekly target">£750</output>
        <div class="target-controls" aria-label="Adjust weekly target">
          <button type="button" data-target-change="-50">−£50</button>
          <button type="button" data-target-change="-10">−£10</button>
          <button type="button" data-target-change="10">+£10</button>
          <button type="button" data-target-change="50">+£50</button>
        </div>
      </section>

      <!-- Week Summary -->
      <section class="week-summary" aria-label="Week at a glance">
        <div>
          <p class="eyebrow">THIS WEEK</p>
          <strong id="week-earned">£0 <span>/ £750</span></strong>
        </div>
        <div>
          <p class="eyebrow">REMAINING</p>
          <strong id="week-remaining">£750</strong>
        </div>
        <div class="miles-summary">
          <p class="eyebrow">BUSINESS MILES</p>
          <strong id="week-miles">0.0</strong>
        </div>
      </section>

      <!-- £50 Progress Blocks -->
      <section class="block-progress" aria-label="Fifty pound weekly progress blocks">
        <div>
          <p class="eyebrow">£50 BLOCKS</p>
          <span id="block-status">BUILDING THE WEEK</span>
        </div>
        <div id="week-blocks" class="week-blocks" aria-hidden="true"></div>
      </section>

      <!-- Weekly Plan - 7 Day Tiles -->
      <section class="plan-section" aria-labelledby="plan-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">WEEKLY PLAN</p>
            <h2 id="plan-title">Your week</h2>
          </div>
          <p class="section-hint">Tap tile to edit &bull; Tap toggle for work/off</p>
        </div>
        <div id="day-tiles" class="day-tiles" aria-live="polite"></div>
      </section>

      <!-- Day Earnings Editor Card (Defaults to Today, selectable to any day) -->
      <section class="editor-card" aria-labelledby="editor-title">
        <div class="editor-header">
          <div>
            <p id="editor-eyebrow" class="eyebrow">TODAY'S EARNINGS</p>
            <h2 id="editor-title">Today</h2>
          </div>
          <div class="editor-header-actions">
            <button type="button" id="btn-return-today" class="editor-return-btn" style="display:none;">Return to Today</button>
            <span id="editor-status" class="status-pill">WORKING</span>
          </div>
        </div>

        <div class="today-figures">
          <div><span>EARNED</span><strong id="editor-earned">£0</strong></div>
          <div><span>TARGET</span><strong id="editor-target">£0</strong></div>
          <div><span>TO GO</span><strong id="editor-remaining">£0</strong></div>
          <div><span>MILES</span><strong id="editor-miles">0.0</strong></div>
        </div>

        <div class="today-progress" aria-hidden="true">
          <i id="editor-progress-bar"></i>
        </div>

        <!-- Inline Day Earnings & Miles Update Form -->
        <form id="day-editor-form" class="editor-form-grid" onsubmit="return false;">
          <div class="editor-field">
            <label for="input-gross">GROSS EARNINGS (&pound;)</label>
            <div class="editor-input-wrap">
              <span class="currency-prefix">&pound;</span>
              <input id="input-gross" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" class="editor-input">
            </div>
            <div class="editor-quick-row">
              <button type="button" class="quick-btn" data-add-gross="5">+&pound;5</button>
              <button type="button" class="quick-btn" data-add-gross="10">+&pound;10</button>
              <button type="button" class="quick-btn" data-add-gross="20">+&pound;20</button>
              <button type="button" class="quick-btn" data-add-gross="50">+&pound;50</button>
            </div>
          </div>

          <div class="editor-field">
            <label for="input-miles">BUSINESS MILES</label>
            <div class="editor-input-wrap">
              <input id="input-miles" type="number" step="0.1" min="0" inputmode="decimal" placeholder="0.0" class="editor-input no-prefix">
            </div>
            <div class="editor-quick-row">
              <button type="button" class="quick-btn" data-add-miles="5">+5 mi</button>
              <button type="button" class="quick-btn" data-add-miles="10">+10 mi</button>
              <button type="button" class="quick-btn" data-add-miles="20">+20 mi</button>
            </div>
          </div>

          <div class="editor-actions">
            <button type="button" id="btn-save-day" class="btn-save-day">Save Day Earnings</button>
            <button type="button" id="btn-reset-day" class="btn-reset-day">Reset to &pound;0</button>
          </div>
        </form>
      </section>
    </main>

    <div id="celebration" class="celebration" aria-live="assertive" aria-atomic="true"></div>
    <script type="module" src="js/v2.js?v=3.1.0"></script>
  </body>
</html>
