<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico">
  <title>Uber Engine</title>

  <link rel="stylesheet" href="css/styles.css?v=2.2.20">

  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>

<body>
  <div class="app-container">

    <h1>Uber Engine</h1>

    <h1 id="app-version"></h1>
    <p id="app-version-notes"></p>

    <div id="sync-status" class="sync-status hidden"></div>

    <div class="tab-bar">
      <button class="tab-button active" data-tab="day_tab">Day</button>
      <button class="tab-button" data-tab="month_tab">Month</button>
      <button class="tab-button" data-tab="fuel_tab">Costs</button>
      <button class="tab-button" data-tab="settings_tab">Settings</button>
    </div>

    <!-- ================= DAY TAB ================= -->

    <div id="day_tab" class="tab-content active">

      <div class="card target-card">
        <div class="target-card__header">
          <div>
            <h2>Weekly Target</h2>
            <p id="target_status" class="target-status">Set a target to track this week.</p>
          </div>
        </div>

        <div class="target-plan-grid">
          <div class="field">
            <label for="weekly_target">Target Gross (&pound;)</label>
            <div class="target-gross-nav">
              <button id="target_prev_week" type="button" aria-label="Previous week's target">&lt;&lt;</button>
              <input id="weekly_target" type="number" min="0" step="1" inputmode="numeric" placeholder="910">
              <button id="target_next_week" type="button" aria-label="Next week's target">&gt;&gt;</button>
            </div>
          </div>

          <div class="field">
            <label>Planned Work Days</label>
            <div id="target_workdays" class="target-workdays" aria-label="Planned work days"></div>
          </div>
        </div>

        <div id="target_week_strip" class="target-week-strip" aria-label="Week so far"></div>

        <div id="target_summary" class="target-summary-grid"></div>
      </div>

      <div class="card">
        <h2>Log Session</h2>

        <div class="field">
          <label for="day_date">Work Date</label>
          <select id="day_date"></select>
        </div>

        <div class="form-row-2">
          <div class="field">
            <label for="day_gross">Gross Earnings (Â£)</label>
            <input id="day_gross" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </div>

          <div class="field">
            <label for="day_miles">Business Miles</label>
            <input id="day_miles" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0.0">
          </div>
        </div>

        <button id="save_day" type="button" class="btn-primary">Save Session</button>
      </div>

      <div class="card">
        <div class="week-header">
          <h3 id="week_title">This Week</h3>
          <div class="week-nav">
            <button id="prev_week" type="button">Prev Week</button>
            <button id="this_week" type="button">This Week</button>
            <button id="next_week" type="button">Next Week</button>
          </div>
        </div>

        <div id="week_summary" class="summary-grid"></div>
      </div>

      <div class="card">
        <h3>Worked Sessions</h3>
        <div id="dayList"></div>
      </div>

    </div>

    <!-- ================= MONTH TAB ================= -->

    <div id="month_tab" class="tab-content">

      <div class="card">
        <h3>Month</h3>
        <label for="month_picker">Select Month</label>
        <input type="month" id="month_picker">
      </div>

      <div class="card">
        <h3>Uber Weekly Statement</h3>

        <div class="form-row-2">
          <div class="field">
            <label for="uber_statement_week_start">Week Start</label>
            <input id="uber_statement_week_start" type="date">
          </div>

          <div class="field">
            <label for="uber_statement_week_end">Week End</label>
            <input id="uber_statement_week_end" type="date">
          </div>
        </div>

        <div class="form-row-2">
          <div class="field">
            <label for="uber_customer_payments">Customer Payments (&pound;)</label>
            <input id="uber_customer_payments" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </div>

          <div class="field">
            <label for="uber_tips">Tips (&pound;)</label>
            <input id="uber_tips" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </div>
        </div>

        <div class="form-row-2">
          <div class="field">
            <label for="uber_taxes_third_party_fees">Taxes &amp; 3rd Party Fees (&pound;)</label>
            <input id="uber_taxes_third_party_fees" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </div>

          <div class="field">
            <label for="uber_service_fee">Uber Service Fee (&pound;)</label>
            <input id="uber_service_fee" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </div>
        </div>

        <div class="form-row-2">
          <div class="field">
            <label for="uber_earnings">Earnings (&pound;)</label>
            <input id="uber_earnings" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </div>

          <div class="field">
            <label for="uber_total_earnings">Total Earnings (&pound;)</label>
            <input id="uber_total_earnings" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </div>
        </div>

        <button id="save_uber_weekly" type="button" class="btn-primary">
          Save Weekly Statement
        </button>
      </div>

      <div class="card">
        <h3>Uber Weekly Statements</h3>
        <div id="uber_weekly_history"></div>
      </div>

      <div class="card">
        <h3>Month Summary</h3>
        <div id="month_summary" class="summary-grid"></div>

        <div class="month-export-actions">
          <button id="export-month" type="button" class="btn-primary">
            Export Month
          </button>

          <button id="export-mtd" type="button" class="btn-secondary">
            Export MTD
          </button>
        </div>
      </div>

    </div>

    <!-- ================= COSTS TAB ================= -->

    <div id="fuel_tab" class="tab-content">

      <div class="cost-toggle" role="tablist" aria-label="Cost type">
        <button class="cost-toggle__button active" type="button" data-cost-panel="fuel_cost_panel">Fuel</button>
        <button class="cost-toggle__button" type="button" data-cost-panel="expense_cost_panel">Expense</button>
      </div>

      <div id="fuel_cost_panel" class="cost-panel active">
        <div class="card">
          <h3>Log Fuel</h3>

          <label for="fuel_date">Date</label>
          <input type="date" id="fuel_date">

          <div class="form-row-2">
            <div>
              <label for="fuel_litres">Litres</label>
              <input type="number" id="fuel_litres" step="0.01" inputmode="decimal">
            </div>

            <div>
              <label for="fuel_cost">Cost (&pound;)</label>
              <input type="number" id="fuel_cost" step="0.01" inputmode="decimal" required>
            </div>
          </div>

          <label for="fuel_miles">Mileage</label>
          <input type="number" id="fuel_miles" inputmode="numeric" required>

          <button id="save_fuel" class="btn-primary" type="button">
            Save Fuel
          </button>
        </div>

        <div class="card">
          <h3>Fuel History</h3>
          <div id="fuel_history"></div>
        </div>
      </div>

      <div id="expense_cost_panel" class="cost-panel">
        <div class="card">
          <h3>Log Expense</h3>

          <form id="expense-form">
            <label for="expense_date">Date</label>
            <input type="date" id="expense_date">

            <label for="expense_category">Category</label>
            <select id="expense_category"></select>

            <label for="expense_amount">Amount (&pound;)</label>
            <input type="number" step="0.01" id="expense_amount">

            <label for="expense_notes">Notes</label>
            <input type="text" id="expense_notes">

            <button id="save_expense" class="btn-primary" type="button">Save Expense</button>
          </form>
        </div>

        <div class="card">
          <h3>Expense History</h3>
          <div id="expenseList"></div>
        </div>
      </div>

    </div>
    <!-- ================= SETTINGS TAB ================= -->

    <div id="settings_tab" class="tab-content">

      <div class="card settings-panel">
        <h2>Settings</h2>

        <div class="settings-section">
          <h3>Targets</h3>
          <div class="field">
            <label for="settings_weekly_target_mode">Weekly Target Mode</label>
            <select id="settings_weekly_target_mode">
              <option value="manual">Manual</option>
              <option value="dynamic">Dynamic</option>
            </select>
          </div>

          <div class="form-row-2">
            <div class="field">
              <label for="settings_dynamic_uplift">Dynamic Uplift</label>
              <select id="settings_dynamic_uplift">
                <option value="0">0%</option>
                <option value="5">5%</option>
                <option value="10">10%</option>
                <option value="custom">Custom %</option>
              </select>
            </div>

            <div class="field">
              <label for="settings_dynamic_uplift_custom">Custom Uplift (%)</label>
              <input id="settings_dynamic_uplift_custom" type="number" min="0" step="0.1" inputmode="decimal">
            </div>
          </div>

          <div class="field">
            <label for="settings_weekly_target">Default Weekly Target (Â£)</label>
            <input id="settings_weekly_target" type="number" min="0" step="1" inputmode="numeric">
          </div>
        </div>

        <div class="settings-section">
          <h3>Vehicle</h3>
          <div class="form-row-2">
            <div class="field">
              <label for="settings_fuel_type">Fuel Type</label>
              <select id="settings_fuel_type">
                <option value="petrol">Petrol</option>
                <option value="diesel">Diesel</option>
                <option value="hybrid">Hybrid</option>
                <option value="ev">EV</option>
              </select>
            </div>

            <div class="field">
              <label for="settings_mpg">MPG Estimate</label>
              <input id="settings_mpg" type="number" min="1" step="0.1" inputmode="decimal">
            </div>
          </div>

          <div class="form-row-2">
            <div class="field">
              <label for="settings_vehicle_model">Car Model</label>
              <input id="settings_vehicle_model" type="text" placeholder="e.g. Toyota Prius">
            </div>

            <div class="field">
              <label for="settings_vehicle_reg">Reg Number</label>
              <input id="settings_vehicle_reg" type="text" placeholder="Optional">
            </div>
          </div>
        </div>

        <div class="settings-section">
          <h3>Operating Costs</h3>
          <div class="form-row-2">
            <div class="field">
              <label for="settings_insurance_monthly">Insurance / Month (Â£)</label>
              <input id="settings_insurance_monthly" type="number" min="0" step="0.01" inputmode="decimal">
            </div>

            <div class="field">
              <label for="settings_tax_rate">Tax Rate (%)</label>
              <input id="settings_tax_rate" type="number" min="0" max="100" step="0.1" inputmode="decimal">
            </div>
          </div>

          <div class="field">
            <label for="settings_fuel_price">Fallback Fuel Price / L (Â£)</label>
            <input id="settings_fuel_price" type="number" min="0" step="0.01" inputmode="decimal">
          </div>

          <div class="field">
            <label for="settings_vehicle_expense_method">Vehicle Expense Method</label>
            <select id="settings_vehicle_expense_method">
              <option value="mileage">Mileage claim (45p / mile)</option>
              <option value="actual">Actual vehicle costs</option>
            </select>
          </div>
        </div>

        <div class="settings-section">
          <h3>EV Charging</h3>
          <div class="form-row-2">
            <div class="field">
              <label for="settings_ev_home_off_peak">Home Off-Peak (p/kWh)</label>
              <input id="settings_ev_home_off_peak" type="number" min="0" step="0.1" inputmode="decimal">
            </div>

            <div class="field">
              <label for="settings_ev_home_peak">Home Peak (p/kWh)</label>
              <input id="settings_ev_home_peak" type="number" min="0" step="0.1" inputmode="decimal">
            </div>
          </div>

          <div class="form-row-2">
            <div class="field">
              <label for="settings_ev_public_rate">Public Charging (p/kWh)</label>
              <input id="settings_ev_public_rate" type="number" min="0" step="0.1" inputmode="decimal">
            </div>

            <div class="field">
              <label for="settings_ev_charging_mix">Main Charging</label>
              <select id="settings_ev_charging_mix">
                <option value="home_off_peak">Home off-peak</option>
                <option value="home_mixed">Home mixed</option>
                <option value="public_mixed">Public mixed</option>
              </select>
            </div>
          </div>
        </div>

        <div class="settings-actions">
          <button id="save_settings" type="button" class="btn-primary">Save Settings</button>
          <button id="reset_settings" type="button">Reset Defaults</button>
        </div>

        <div id="settings_status" class="settings-status" aria-live="polite"></div>
      </div>

    </div>

  </div>

  <script type="module" src="js/app.js?v=2.2.20"></script>
</body>

</html>
